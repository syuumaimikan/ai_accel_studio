[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accel-studio"
version = "5.0.0"
description = "LLM inference acceleration studio with mixed-bit INT2/INT4/FP16 planning, held-out quality guard, static KV cache + CUDA-graph-friendly compilation, Hopper/Blackwell experiments, energy metrics and GUI."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
gpu = ["triton>=3.3", "ninja>=1.11", "pynvml>=11.5"]
models = ["transformers[kernels]>=5.14,<5.18", "accelerate>=1.0", "safetensors>=0.5", "sentencepiece>=0.2", "torchao>=0.17,<0.19"]
gui = ["gradio>=6.0", "plotly>=6.0"]
full = ["triton>=3.3", "ninja>=1.11", "pynvml>=11.5", "transformers[kernels]>=5.14,<5.18", "accelerate>=1.0", "safetensors>=0.5", "sentencepiece>=0.2", "torchao>=0.17,<0.19", "gradio>=6.0", "plotly>=6.0"]

[project.scripts]
ai-accel-studio = "ai_accel_lab.studio.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ai_accel_lab*"]
exclude = ["tests*", "results*"]
