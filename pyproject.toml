[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accel-studio"
version = "3.0.0"
description = "Hopper/Blackwell-aware AI inference acceleration laboratory with groupwise INT2, 2:4 sparsity, TMA/WGMMA/tcgen05 experiments, model accuracy guard, energy benchmark and GUI."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "psutil>=5.9",
]

[project.optional-dependencies]
gpu = ["triton>=3.4", "ninja>=1.11", "pynvml>=11.5"]
models = ["transformers>=5.0", "accelerate>=1.0", "safetensors>=0.5", "sentencepiece>=0.2", "torchao>=0.15", "kernels>=0.11"]
gui = ["gradio>=6.0", "plotly>=6.0"]
full = ["triton>=3.4", "ninja>=1.11", "pynvml>=11.5", "transformers>=5.0", "accelerate>=1.0", "safetensors>=0.5", "sentencepiece>=0.2", "torchao>=0.15", "kernels>=0.11", "gradio>=6.0", "plotly>=6.0"]

[project.scripts]
ai-accel-studio = "ai_accel_lab.studio.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ai_accel_lab*"]
exclude = ["tests*", "results*"]
